<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classification Result</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        h1 {
            color: #4CAF50;
            font-size: 36px;
            text-align: center;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            color: #333;
            margin: 5px 0;
        }

        .result-box {
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            width: 80%;
            max-width: 500px;
            text-align: center;
        }

        .result-box img {
            max-width: 300px;
            margin-top: 20px;
            border-radius: 8px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }

        a:hover {
            background-color: #45a049;
        }

        .back-link {
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="result-box">
        <h1>Classification Result</h1>
        <p><strong>Predicted Class:</strong> {{ class_name }}</p>
        <p><strong>Confidence Score:</strong> {{ confidence_score }}</p>
        <img src="{{ image_path }}" alt="Uploaded Image">
        <br>
        <a href="/" class="back-link">Classify Another Image</a>
    </div>
</body>
</html>
